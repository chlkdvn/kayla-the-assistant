[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kayla-robot"
version = "0.3.0"
description = "The modular Python brain for the Kayla conversational robot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "python-dotenv>=1,<2",
    "fastembed>=0.6,<1",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]
voice = [
    "numpy>=2,<3",
    "opencv-python-headless>=4,<5",
    "google-genai>=1,<2",
    "pvporcupine>=3,<4",
    "sounddevice>=0.5,<1",
    "vosk>=0.3,<1",
]
face = [
    "pygame-ce>=2.4,<3",
]
[project.scripts]
kayla = "kayla.interfaces.cli:main"
kayla-setup = "kayla.setup.cli:main"
kayla-realtime = "kayla.interfaces.realtime_cli:main"
kayla-voice = "kayla.interfaces.voice_cli:main"
kayla-face = "kayla.face.app:main"
kayla-orb = "kayla.orb.app:main"
kayla-boot = "kayla.setup.boot:main"
kayla-seed-memory = "kayla.memory.seed_memories:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kayla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
